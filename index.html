function buildDoc(c,gestor,dec,com,obs){
  const ap=Object.values(dec).filter(v=>v==="ap").length;
  const aj=Object.values(dec).filter(v=>v==="aj").length;
  const tot=c.acoes.length;
  const linhas=c.acoes.map((a,i)=>{
    const d=dec[i]==="ap"?"APROVADO":dec[i]==="aj"?"REQUER AJUSTE":"PENDENTE";
    return (i+1)+". ["+d+"] "+a.a+" | "+a.prazo+(com[i]?"\n   >> "+com[i]:"");
  });
  return ["================================================","  RETORNO - CARTEIRA "+c.nome.toUpperCase(),"================================================","Responsavel: "+gestor,"Data: "+new Date().toLocaleDateString("pt-BR"),"Aprovados: "+ap+"/"+tot+" | Ajustes: "+aj+"/"+tot+" | Pendentes: "+(tot-ap-aj)+"/"+tot,"","-- DECISOES --------------------------------------------",...linhas,"","-- OBSERVACOES -----------------------------------------",obs||"(sem observacoes)","","================================================","  procurement@hotmart.com","================================================"].join("\n");
}

        <div>
          {card("#fff","#e5e7eb",<div><p style
={{fontWeight:700,margin:"0 0 4px"}}>Migracoes Propostas</p><p style={{color:"#6b7280",fontSize:14,margin:0}}>Clique em cada item para ver o beneficio esperado.</p></div>)}
          {c.migracoes.map((m,i)=>(
            <div key={i} style={{background:"#fff",border:"1px solid "+(exp===i?"#93c5fd":"#e5e7eb"),borderRadius:12,padding:14,marginBottom:10,cursor:"pointer"}} onClick={()=>setExp(exp===i?null:i)}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
                    <span style={{background:"#fee2e2",color:"#b91c1c",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700,textDecoration:"line-through",fontFamily:"monospace"}}>{m.from}</span>
                    <span style={{fontSize:12,color:"#9ca3af",fontWeight:700}}>→</span>
                    <span style={{background:"#dcfce7",color:"#166534",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>{m.to}</span>
                  </div>
                  <p style={{fontSize:12,color:"#6b7280",margin:0}}>{m.itens}</p>
                </div>
                <div style={{textAlign:"right",minWidth:80}}>
                  <p style={{fontSize:11,color:"#9ca3af",margin:0}}>Spend</p>
                  <p style={{fontWeight:700,fontSize:13,margin:0}}>{m.spend}</p>
                </div>
              </div>
              {exp===i&&(<div style={{marginTop:10,paddingTop:10,borderTop:"1px solid #f3f4f6"}}>
                <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",margin:"0 0 4px",textTransform:"uppercase"}}>Beneficio Esperado</p>
                <p style={{fontSize:13,color:"#374151",margin:0}}>{m.benefit}</p>
              </div>)}
            </div>
          ))}
        </div>
      )}
      {st===2&&(
        <div>
          {card("#fff","#e5e7eb",<div><p style={{fontWeight:700,margin:"0 0 4px"}}>Commodities para Desativar (Sunset)</p><p style={{color:"#6b7280",fontSize:14,margin:0}}>Apos aprovacao, serao bloqueadas para novos pedidos. Migracao dos itens existentes em ate 90 dias pelo time de MDM.</p></div>)}
          {c.sunset.map((s,i)=>(
            <div key={i} style={{background:"#fff",border:"1px solid #fecaca",borderRadius:12,padding:14,marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
                <div style={{flex:1}}>
                  <p style={{fontWeight:700,color:"#dc2626",fontSize:13,margin:"0 0 4px",textDecoration:"line-through",fontFamily:"monospace"}}>🚫 {s.name}</p>
                  <p style={{fontSize:12,color:"#6b7280",margin:0}}>{s.reason}</p>
                </div>
                <span style={{background:"#dcfce7",color:"#166534",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>✅ {s.to}</span>
              </div>
            </div>
          ))}
          <div style={{background:"#fefce8",border:"1px solid #fde047",borderRadius:12,padding:14}}>
            <p style={{fontSize:13,color:"#713f12",margin:0}}>⚠️ <strong>Acao MDM pos-aprovacao:</strong> bloqueio de novas POs nas commodities acima. Pedidos em aberto nao sao afetados.</p>
          </div>
        </div>
      )}

      {st===3&&(
        <div>
          {card("#fff","#e5e7eb",<div><p style={{fontWeight:700,margin:"0 0 4px"}}>Checklist de Aprovacao</p><p style={{color:"#6b7280",fontSize:14,margin:0}}>Avalie cada acao. Ao finalizar, va para Retorno MDM para gerar o documento de retorno.</p></div>)}
          {c.acoes.map((item,i)=>(
            <div key={i} style={{background:dec[i]==="ap"?"#f0fdf4":dec[i]==="aj"?"#fefce8":"#fff",border:"1px solid "+(dec[i]==="ap"?"#86efac":dec[i]==="aj"?"#fde047":"#e5e7eb"),borderRadius:12,padding:14,marginBottom:10}}>
              <p style={{fontWeight:600,fontSize:13,margin:"0 0 8px"}}>{item.a}</p>
              <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
                <span style={{background:"#f3f4f6",color:"#6b7280",borderRadius:6,padding:"2px 8px",fontSize:11}}>🗓️ {item.prazo}</span>
                <span style={{background:ESF_BG[item.esf],color:ESF_TX[item.esf],borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>💪 {item.esf}</span>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>toggle(i,"ap")} style={{flex:1,padding:"6px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",background:dec[i]==="ap"?"#22c55e":"#fff",color:dec[i]==="ap"?"#fff":"#16a34a",border:"1.5px solid "+(dec[i]==="ap"?"#22c55e":"#86efac")}}>✅ Aprovar</button>
                <button onClick={()=>toggle(i,"aj")} style={{flex:1,padding:"6px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",background:dec[i]==="aj"?"#eab308":"#fff",color:dec[i]==="aj"?"#fff":"#a16207",border:"1.5px solid "+(dec[i]==="aj"?"#eab308":"#fde047")}}>⚠️ Requer Ajuste</button>
              </div>
            </div>
          ))}
          <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:12,padding:14}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontSize:12,fontWeight:700,color:"#374151"}}>Progresso</span>
              <span style={{fontSize:12,fontWeight:700,color:"#374151"}}>{aval}/{tot}</span>
            </div>
            <div style={{background:"#e5e7eb",borderRadius:99,height:8,marginBottom:8}}>
              <div style={{background:"#22c55e",borderRadius:99,height:8,width:((aval/tot)*100)+"%",transition:"width 0.4s"}}/>
            </div>
            <div style={{display:"flex",gap:16,fontSize:12,color:"#6b7280"}}>
              <span>✅ <strong style={{color:"#16a34a"}}>{ap}</strong> aprovados</span>
              <span>⚠️ <strong style={{color:"#a16207"}}>{aj}</strong> ajustes</span>
              <span>⏳ <strong>{tot-aval}</strong> pendentes</span>
            </div>
            {aval===tot&&<p style={{color:"#16a34a",fontWeight:700,fontSize:13,textAlign:"center",marginTop:8}}>🎉 Tudo avaliado! Va para Retorno MDM.</p>}
          </div>
        </div>
      )}

      {st===4&&(
        <div>
          {card("#fff","#e5e7eb",<div><p style={{fontWeight:700,margin:"0 0 4px"}}>Gerar Retorno para o Time de MDM</p><p style={{color:"#6b7280",fontSize:14,margin:0}}>Preencha os campos e copie o documento. Cole em e-mail ou ticket para o time de MDM.</p></div>)}
          <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:12,padding:16,marginBottom:12}}>
            <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",margin:"0 0 6px"}}>Seu nome (Responsavel)</p>
            <input type="text" value={gestor} onChange={e=>setG(e.target.value)} style={{width:"100%",border:"1px solid #e5e7eb",borderRadius:8,padding:"8px 12px",fontSize:13,boxSizing:"border-box",outline:"none"}}/>
          </div>
          <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:12,padding:16,marginBottom:12}}>
            <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",margin:"0 0 10px"}}>Comentarios por acao</p>
            {c.acoes.map((a,i)=>(
              <div key={i} style={{marginBottom:10,padding:10,border:"1px solid #f3f4f6",borderRadius:8}}>
                <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
                  <span style={{background:dec[i]==="ap"?"#dcfce7":dec[i]==="aj"?"#fef9c3":"#f3f4f6",color:dec[i]==="ap"?"#166534":dec[i]==="aj"?"#713f12":"#9ca3af",borderRadius:99,padding:"2px 8px",fontSize:11,fontWeight:700}}>
                    {dec[i]==="ap"?"✅ Aprovado":dec[i]==="aj"?"⚠️ Ajuste":"⏳ Pendente"}
                  </span>
                  <span style={{fontSize:11,color:"#6b7280"}}>{a.a}</span>
                </div>
                <textarea rows={2} value={com[i]||""} onChange={e=>setc(i,e.target.value)} placeholder="Observacao opcional..." style={{width:"100%",border:"1px solid #e5e7eb",borderRadius:6,padding:"6px 8px",fontSize:12,resize:"none",boxSizing:"border-box",outline:"none"}}/>
              </div>
            ))}
          </div>
          <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:12,padding:16,marginBottom:12}}>
            <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",margin:"0 0 6px"}}>Observacoes Gerais</p>
            <textarea rows={3} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Ex: Aguardar alinhamento com CFO antes de confirmar item 5..." style={{width:"100%",border:"1px solid #e5e7eb",borderRadius:8,padding:"8px 12px",fontSize:13,resize:"none",boxSizing:"border-box",outline:"none"}}/>
          </div>
          <div style={{background:"#111827",borderRadius:12,padding:16,marginBottom:12}}>
            <p style={{fontSize:11,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",margin:"0 0 8px"}}>Preview do Documento</p>
            <pre style={{color:"#86efac",fontSize:11,margin:0,whiteSpace:"pre-wrap",wordBreak:"break-word",maxHeight:200,overflow:"auto"}}>{buildDoc(c,gestor,dec,com,obs)}</pre>
          </div>
          <button onClick={copiar} style={{width:"100%",padding:"12px",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",border:"none",background:cp?"#22c55e":"#111827",color:"#fff",transition:"background 0.3s"}}>
            {cp?"✅ Copiado com sucesso!":"📋 Copiar Documento"}
          </button>
          <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:12,padding:14,marginTop:12}}>
            <p style={{fontSize:12,fontWeight:700,color:"#1d4ed8",margin:"0 0 6px"}}>Como enviar o retorno:</p>
            <ol style={{fontSize:12,color:"#1e40af",margin:0,paddingLeft:16}}>
              <li>Clique em Copiar Documento acima</li>
              <li>Cole no corpo do e-mail ou ticket</li>
              <li>Envie para procurement@hotmart.com</li>
              <li>MDM abre as tarefas em ate 5 dias uteis</li>
            </ol>
          </div>
        </div>
      )}
    </div>
  );
}
function App(){
  const [carteira,setCarteira]=React.useState(0);
  const c=CARTEIRAS[carteira];
  return(
    <div style={{maxWidth:900,margin:"0 auto",padding:16}}>
      <div style={{background:"linear-gradient(135deg, "+c.cor+" 0%, #000 100%)",borderRadius:16,padding:24,marginBottom:20,color:"#fff"}}>
        <p style={{fontSize:11,color:"rgba(255,255,255,0.5)",textTransform:"uppercase",letterSpacing:2,margin:"0 0 4px"}}>Business Review - Taxonomia de Procurement</p>
        <h1 style={{fontSize:24,fontWeight:800,margin:"0 0 4px"}}>{c.emoji} Carteira: {c.nome}</h1>
        <p style={{fontSize:13,color:"rgba(255,255,255,0.6)",margin:"0 0 20px"}}>Responsavel: {c.resp} · Spend Total: {c.spend} · v1.0 · Maio 2026</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
          {[["Commodities Ativas",c.kpis.ativas,"#93c5fd"],["A Migrar",c.kpis.migrar,"#fde047"],["Sunset",c.kpis.sunset,"#fca5a5"],["Novas",c.kpis.novas,"#86efac"]].map(([l,v,col])=>(
            <div key={l} style={{background:"rgba(255,255,255,0.1)",borderRadius:10,padding:12,textAlign:"center"}}>
              <p style={{fontSize:24,fontWeight:800,color:col,margin:0}}>{v}</p>
              <p style={{fontSize:11,color:"rgba(255,255,255,0.6)",margin:0}}>{l}</p>
            </div>
          ))}
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        {CARTEIRAS.map((ct,i)=>(
          <button key={i} onClick={()=>setCarteira(i)} style={{padding:"8px 16px",borderRadius:10,fontSize:13,fontWeight:600,cursor:"pointer",border:"none",background:carteira===i?ct.cor:"#f3f4f6",color:carteira===i?"#fff":"#374151",transition:"all 0.2s"}}>
            {ct.emoji} {ct.nome}
          </button>
        ))}
      </div>

      <Painel key={c.id} c={c}/>

      <div style={{textAlign:"center",marginTop:24,padding:16,color:"#9ca3af",fontSize:12}}>
        Hotmart Procurement · MDM Taxonomy Review v1.0 · 2026
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
